name: Continuous Deployment

on: 
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select the environment to deploy to
        default: Development
        options:
        - Development
        - Staging
        - Production
 
permissions:
  contents: write
  packages: write
  repository-projects: write
  id-token: write
  pull-requests: read

jobs:

  version:
    uses: codedesignplus/workflows/.github/workflows/release.yaml@main
    with:
      project-name: CodeDesignPlus.Net.Microservice.Licenses
      microservice-name: ms-licenses
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit

  container:
    needs: version
    uses: codedesignplus/workflows/.github/workflows/container-image.yaml@main
    with:
      project-name: CodeDesignPlus.Net.Microservice.Licenses
      microservice-name: ms-licenses
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit
  
  deploy:
    needs: container
    # Desactivado: ningun cluster esta conectado a este despliegue por ahora. Para reactivarlo,
    # quitar el if: false.
    if: false
    uses: codedesignplus/workflows/.github/workflows/deploy-self-host.yaml@main
    with:
      project-name: CodeDesignPlus.Net.Microservice.Licenses
      microservice-name: ms-licenses
      enable-rest: true
      enable-grpc: true
      enable-worker: true
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit